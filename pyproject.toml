[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semcache"
version = "0.1.0"
description = "Semantic caching layer for LLM apps: FAISS vector search + LRU eviction in front of any chat model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "faiss-cpu>=1.9.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Local ONNX embedder. Deliberately optional and deliberately NOT
# sentence-transformers: fastembed is ~50MB of onnxruntime instead of ~2.5GB of torch.
local = ["fastembed>=0.4"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
semcache = "semcache.cli:main"

[tool.setuptools.packages.find]
include = ["semcache*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
