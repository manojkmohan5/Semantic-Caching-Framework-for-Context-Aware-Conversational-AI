name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  # SEMCACHE_OFFLINE is deliberately NOT set workflow-wide. It used to be, and it
  # silently forced every test onto the stub provider -- green locally, red here.
  # The CLI steps pass --offline explicitly, and the suite clears all SEMCACHE_*
  # vars in conftest.py so the environment can never steer it.

# Five job entries, down from eight. Each one below has caught a real bug at
# least once; anything that only duplicated another job's coverage is gone.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    # Two corners rather than a full grid: the oldest supported Python on
    # Windows, and the newest on Linux. Windows earns its place -- the cp1252
    # console, the os.replace sharing violation and the coarse clock behind the
    # LRU bug were all Windows-only. The middle of the matrix never caught
    # anything the corners missed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (core + openai + dev; no ONNX model download)
        # openai is needed by test_openai_compatible.py, which drives the real
        # client against a local mock endpoint. No key, no network, no model.
        run: pip install -e ".[openai,dev]"
      - name: Tests
        run: pytest

      # The old separate `smoke` job folded in here: same install, only a few
      # CLI invocations, so it does not need a runner of its own.
      - name: CLI starts
        run: |
          semcache --version
          semcache --help
      - name: Offline benchmark meets its latency targets
        run: semcache bench --offline --embedder hash --assert-targets
      - name: Cache survives a restart
        shell: bash
        run: |
          semcache ask --offline --embedder hash "what is a semantic cache"
          semcache ask --offline --embedder hash "what is a semantic cache" | tee second.txt
          grep -q "from cache" second.txt
      - name: Projects are isolated from each other
        shell: bash
        run: |
          semcache ask --offline --embedder hash --project a "shared question"
          semcache ask --offline --embedder hash --project b "shared question" | tee b.txt
          grep -q "asked the model" b.txt

  bench:
    # The real ONNX embedder, so paraphrase quality and the trap-question gate
    # are measured for real. Separate because it downloads a model; the cache
    # keeps that cheap.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[local,dev]"
      - name: Cache the ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.semcache/models
          key: onnx-all-MiniLM-L6-v2-v1
      - name: Benchmark with real embeddings
        run: semcache bench --offline --embedder local --assert-targets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: bench-report.json
          if-no-files-found: warn

  docker:
    # Kept because it catches what the unit tests structurally cannot: package
    # data missing from the wheel, and the baked model being masked by the
    # mounted volume. Both were real bugs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: semcache:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Benchmark passes with no network at all
        # --network none proves the ONNX model really is baked into the image.
        run: docker run --rm --network none semcache:ci bench --offline --embedder local --assert-targets
      - name: Cache persists across containers
        run: |
          docker volume create semcache-ci
          docker run --rm -v semcache-ci:/data semcache:ci ask --offline "what is a semantic cache"
          docker run --rm -v semcache-ci:/data semcache:ci ask --offline "what is a semantic cache" | tee out.txt
          grep -q "from cache" out.txt
