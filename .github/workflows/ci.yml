name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  # SEMCACHE_OFFLINE is deliberately NOT set workflow-wide. It used to be, and it
  # silently forced every test onto the stub provider -- green locally, red here.
  # The CLI-driven jobs pass --offline on the command line instead, and the test
  # suite clears all SEMCACHE_* vars in conftest.py so the environment can never
  # steer it.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .

  test:
    # Windows is in the matrix on purpose: it is the primary dev platform, and the
    # cp1252 console + faiss wheel + os.replace paths all behave differently there.
    strategy:
      fail-fast: false
      matrix:
        # 3.9 and 3.12 are the ends of the supported range, which is where
        # breakage lives. A middle version added two jobs without covering a
        # boundary, so the matrix is 4 jobs rather than 6.
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (core + openai + dev; still no ONNX model)
        # openai is required by test_openai_compatible.py, which drives the real
        # client against a local mock endpoint. No key, no network, no model.
        run: pip install -e ".[openai,dev]"
      - name: Tests
        # The hash embedder keeps this offline and deterministic: no API key,
        # no 133MB model download, no network.
        run: pytest

  smoke:
    # Proves the CLI actually starts and the cache round-trips on disk,
    # which unit tests alone do not cover.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: CLI starts
        run: |
          semcache --version
          semcache --help
      - name: Offline benchmark meets its latency targets
        # Uses StubProvider + hash embedder. Exits non-zero if a target in the
        # plan's table regresses or if a trap pair returns a false hit.
        run: semcache bench --offline --embedder hash --assert-targets
      - name: Cache survives a restart
        run: |
          semcache ask --offline --embedder hash "what is a semantic cache"
          semcache ask --offline --embedder hash "what is a semantic cache" | tee second.txt
          grep -q "from cache" second.txt
      - name: Project caches are isolated from each other
        run: |
          semcache ask --offline --embedder hash --project a "shared question"
          semcache ask --offline --embedder hash --project b "shared question" | tee b.txt
          grep -q "asked the model" b.txt
      - name: Embeddable API works
        run: |
          python -c "
          from semcache import SemCache
          with SemCache(offline=True, embedder='hash') as sc:
              assert sc.ask('hello there world').source == 'miss'
              assert sc.ask('hello there world').from_cache
          print('api ok')"

  bench:
    # The real ONNX embedder, so paraphrase quality is measured for real.
    # Split from `test` because it downloads a model; the cache keeps it cheap.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[local,dev]"
      - name: Cache the ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.semcache/models
          key: onnx-bge-small-en-v1.5-v1
      - name: Benchmark with real embeddings
        run: semcache bench --offline --embedder local --assert-targets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: bench-report.json
          if-no-files-found: warn

  docker:
    # The image is where most users will meet this, and it has its own failure
    # modes (package data missing from the wheel, the baked model masked by the
    # volume). Building it in CI is the only way those stay caught.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: semcache:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: CLI runs in the container
        run: docker run --rm semcache:ci --version
      - name: Benchmark passes with no network and the real embedder
        # --network none proves the ONNX model really is baked into the image.
        run: docker run --rm --network none semcache:ci bench --offline --embedder local --assert-targets
      - name: Cache persists across containers
        run: |
          docker volume create semcache-ci
          docker run --rm -v semcache-ci:/data semcache:ci ask --offline "what is a semantic cache"
          docker run --rm -v semcache-ci:/data semcache:ci ask --offline "what is a semantic cache" | tee out.txt
          grep -q "from cache" out.txt
